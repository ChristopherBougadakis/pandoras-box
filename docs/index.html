<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100d24">
<title>Pandora's Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
/* Layout: arcade night. Τρεις τροχοί στη σειρά (άσκηση, rarity, σετ), ο ενεργός λάμπει και οι άλλοι σβήνουν.
   Η άσκηση βγαίνει από κουτί που ανοίγει, και από κάτω πέφτει η κάρτα του drop με video και meme.
   Μία σκούρα εμφάνιση επίτηδες: χρυσό για ό,τι πατιέται, τα χρώματα rarity για ό,τι πέφτει. */
:root{
  --bg:#100d24;
  --bg-2:#17133a;
  --panel:#1f1a46;
  --panel-2:#2a2360;
  --line:#3a3378;
  --fg:#f6f3ff;
  --muted:#aaa2dc;
  --ink:#100d24;
  --gold:#ffcc33;
  --gold-hi:#ffe08a;
  --gold-deep:#b98500;
  --r0:#a9b2bf;
  --r1:#36d47c;
  --r2:#3d8cff;
  --r3:#b54dff;
  --r4:#ff9b1f;
  --r5:#ff3d6e;
  --r6:#7af7ff;
  --rainbow:linear-gradient(90deg,var(--r5),var(--gold),var(--r1),var(--r2),var(--r3));
  --g-core:#147a74;
  --g-forearms:#b5434f;
  --g-biceps:#9a3b8e;
  --g-push:#a2661b;
  --g-cardio:#3c4ca0;
  --scrim:rgba(8,6,20,.88);
  --meme-paper:#ffffff;
  --meme-text:#111111;
  --meme-edge:#000000;
  --display:"Bangers","Arial Black",Impact,sans-serif;
  --ui:"M PLUS Rounded 1c",system-ui,-apple-system,"Segoe UI",sans-serif;
  --meme:"Anton",Impact,"Arial Black",sans-serif;
  --meme-ink:Arial,"Helvetica Neue",Helvetica,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background-color:var(--bg)}
body{
  position:relative;z-index:0;margin:0;color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.6px);background-size:22px 22px;
}
/* αργό «σέλας» στο φόντο */
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(32% 28% at 22% 18%,rgba(181,77,255,.24),transparent 70%),
    radial-gradient(28% 26% at 80% 26%,rgba(61,140,255,.17),transparent 70%),
    radial-gradient(34% 28% at 50% 88%,rgba(255,204,51,.10),transparent 70%);
  animation:aurora 26s ease-in-out infinite alternate}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;touch-action:manipulation}
a{color:var(--gold)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

[data-t="0"]{--tier:var(--r0)}
[data-t="1"]{--tier:var(--r1)}
[data-t="2"]{--tier:var(--r2)}
[data-t="3"]{--tier:var(--r3)}
[data-t="4"]{--tier:var(--r4)}
[data-t="5"]{--tier:var(--r5)}
[data-t="6"]{--tier:var(--r6)}
.tb{display:inline-block;font-family:var(--display);font-size:1rem;font-weight:400;letter-spacing:.06em;line-height:1;padding:5px 8px 3px;border-radius:6px;background:var(--tier,var(--panel-2));color:var(--ink);white-space:nowrap;vertical-align:middle}
.tb[data-t="6"],[data-t="6"] .tb{background:var(--rainbow)}

.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:grid;gap:26px}
@media (min-width:720px){.wrap{padding-inline:28px}}
/* μονόστηλα grid: η στήλη δεν φαρδαίνει από το μεγαλύτερο κείμενο */
.wrap,.play,.panel,.loot-inner,.loot-main,.loot-side,.timer,.log-block,.set-body,.odds,.xp,.ov-card{grid-template-columns:minmax(0,1fr)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(3.2rem,11vw,5.6rem);line-height:.9;letter-spacing:.03em;transform:rotate(-2deg);transform-origin:left center;text-shadow:0 5px 0 var(--panel-2),0 12px 24px rgba(0,0,0,.5)}
.logo span{color:var(--gold);text-shadow:0 5px 0 var(--gold-deep),0 0 30px rgba(255,204,51,.35),0 12px 24px rgba(0,0,0,.5)}
.player{flex:0 1 360px;min-width:min(100%,280px);display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.lvl{flex:none;width:58px;height:58px;border-radius:14px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 4px 0 var(--gold-deep);display:grid;place-items:center;align-content:center;gap:2px}
.lvl-label{font-family:var(--display);font-size:.85rem;line-height:1;letter-spacing:.1em}
.lvl-num{font-family:var(--display);font-size:2rem;line-height:.85}
.xp{flex:1;min-width:0;display:grid;gap:6px}
.xp-bar{height:14px;border-radius:999px;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.xp-bar span{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--r4));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xp-text{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sound{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--panel-2);cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.sound[aria-pressed="true"]{color:var(--gold)}
.sound svg{width:22px;height:22px}

/* cards & buttons */
.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.btn{border:0;border-radius:14px;padding:13px 20px 9px;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%);color:var(--ink);font-family:var(--display);font-weight:400;font-size:1.65rem;letter-spacing:.07em;line-height:1;cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 6px 0 var(--gold-deep);transition:transform .08s,box-shadow .08s,filter .2s}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 2px 0 var(--gold-deep)}
.btn:disabled{background:var(--panel-2);color:var(--muted);box-shadow:0 6px 0 rgba(0,0,0,.3);cursor:not-allowed}
.btn-ghost{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 6px 0 rgba(0,0,0,.45)}
.btn-ghost:active:not(:disabled){box-shadow:0 2px 0 rgba(0,0,0,.45)}
.link{justify-self:start;background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.86rem}
.link:hover{color:var(--gold)}
.link:disabled{opacity:.5;cursor:not-allowed}

/* wheels */
.play{display:grid;gap:22px}
.stage{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
@media (min-width:660px) and (max-width:979px){.stage{grid-template-columns:1fr 1fr}#w3{grid-column:1 / -1}}
.wheel-card{min-width:0;padding:16px 16px 20px;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-content:start;gap:14px;transition:border-color .25s,box-shadow .25s}
.wheel-card .wheel{filter:saturate(.7) brightness(.8);transition:filter .3s}
.wheel-card.live{border-color:var(--gold);animation:livepulse 1.8s ease-in-out infinite}
.wheel-card.live .wheel{filter:drop-shadow(0 0 22px rgba(255,204,51,.45))}
.card-head{width:100%;display:flex;align-items:center;gap:10px}
.card-head h2{font-family:var(--display);font-weight:400;font-size:1.9rem;letter-spacing:.05em;line-height:1}
.num{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--panel-2);color:var(--muted);font-family:var(--display);font-size:1.3rem;line-height:1}
.live .num{background:var(--gold);color:var(--ink);box-shadow:0 3px 0 var(--gold-deep)}
.wheel{position:relative;width:min(100%,360px);aspect-ratio:1/1}
.wheel canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.pointer{position:absolute;left:50%;top:-12px;width:34px;height:40px;transform:translateX(-50%);z-index:2;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.spin{width:min(100%,360px)}

/* panels */
.verdict{min-width:0}
.panel{padding:clamp(18px,3.5vw,30px);display:grid;gap:14px;justify-items:start}
.panel[data-t]{border-color:var(--tier);box-shadow:0 0 40px -10px var(--tier),0 6px 0 rgba(0,0,0,.35)}
.title{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,8vw,3.8rem);line-height:.95;letter-spacing:.03em}
.ex-name{font-family:var(--display);font-weight:400;font-size:clamp(2.5rem,8.5vw,4.2rem);line-height:.9;letter-spacing:.03em}
.pips{display:inline-flex;gap:4px;vertical-align:middle}
.pips i{width:10px;height:22px;border-radius:3px;background:var(--panel-2)}
.pips i.on{background:var(--r5);box-shadow:0 0 10px -2px var(--r5)}
.name-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}

/* loot card */
.loot{position:relative;overflow:hidden;border:3px solid var(--tier);border-radius:22px;background:var(--panel);box-shadow:0 0 0 4px color-mix(in srgb,var(--tier) 22%,transparent),0 0 44px -6px var(--tier),0 8px 0 rgba(0,0,0,.4);animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
.loot[data-t="3"]::before,.loot[data-t="4"]::before,.loot[data-t="5"]::before,.loot[data-t="6"]::before{content:"";position:absolute;left:50%;top:50%;width:220%;aspect-ratio:1/1;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--tier) 14%,transparent) 0deg 9deg,transparent 9deg 18deg);animation:rays 24s linear infinite;pointer-events:none}
.loot-banner{position:relative;z-index:1;background:var(--tier);color:var(--ink);font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,6vw,2.3rem);letter-spacing:.07em;line-height:1.05;text-align:center;padding:10px 12px 6px;overflow:hidden}
.loot[data-t="6"] .loot-banner{background:var(--rainbow)}
.loot-banner::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.4s ease-in-out .3s infinite}
.loot-inner{position:relative;z-index:1;padding:clamp(16px,3.5vw,28px);display:grid;gap:22px}
@media (min-width:820px){.loot-inner{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:start}}
.loot-main{display:grid;gap:16px;min-width:0;align-content:start}
.loot-side{display:grid;gap:16px;min-width:0;justify-items:center;align-content:start}
.stat-num{font-family:var(--display);font-weight:400;font-size:clamp(4.4rem,16vw,7.4rem);line-height:.85;letter-spacing:.02em;font-variant-numeric:tabular-nums;text-shadow:0 5px 0 rgba(0,0,0,.45),0 0 34px var(--tier)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills:empty{display:none}
.kg,.pill{font-weight:800;font-size:.92rem;border-radius:999px;padding:5px 12px;white-space:nowrap}
.kg{color:var(--ink);background:var(--gold);box-shadow:0 3px 0 var(--gold-deep)}
.pill{background:var(--bg);border:2px solid var(--tier)}
.pill.hot{background:var(--r5);border-color:var(--r5);color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.actions .btn{flex:1 1 170px}

/* σετ & χρονόμετρο */
.timer{display:grid;gap:10px;padding:14px;border-radius:16px;background:var(--bg);border:2px solid var(--line);max-width:440px}
.t-top{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dots{color:var(--tier,var(--gold));letter-spacing:.15em}
.t-face{font-family:var(--display);font-weight:400;font-size:clamp(3rem,12vw,4.2rem);line-height:.9;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.t-face.prep{color:var(--gold)}
.t-bar{height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.t-bar span{display:block;height:100%;width:0;background:var(--tier,var(--gold));transition:width .1s linear}
.t-btns{display:flex;flex-wrap:wrap;gap:10px}
.t-btns .btn{flex:1 1 120px;font-size:1.3rem;padding:10px 14px 7px}

/* video */
.video{width:100%;display:grid;gap:6px;justify-items:center}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--bg);border:2px solid var(--line)}
.video.short .video-frame{aspect-ratio:9/16;width:min(100%,300px)}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-link{font-size:.8rem;color:var(--muted)}
.video-cta{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:16px;background:var(--bg);border:2px solid var(--line);color:var(--fg);text-decoration:none;font-weight:800;transition:border-color .2s}
.video-cta:hover{border-color:var(--gold)}
.video-cta .play{flex:none;width:46px;height:46px;border-radius:50%;background:var(--gold);box-shadow:0 4px 0 var(--gold-deep);display:grid;place-items:center}
.video-cta .play::before{content:"";margin-left:4px;border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent var(--ink)}

/* memes */
.meme{margin:0;width:100%;max-width:460px;display:grid;grid-template-columns:minmax(0,1fr);border-radius:14px;overflow:hidden;background:var(--meme-paper);box-shadow:0 6px 0 rgba(0,0,0,.4);transform:rotate(-1deg)}
.meme.tall{max-width:330px}
.meme.small{max-width:380px}
.meme.small.tall{max-width:280px}
.meme-cap{padding:10px 12px 8px;font-family:var(--meme-ink);font-weight:700;font-size:1rem;line-height:1.25;color:var(--meme-text)}
.meme-frame{position:relative;width:100%}
.meme-frame img{display:block;width:100%;height:100%;object-fit:cover}
.mbox{position:absolute;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;line-height:1.08;overflow:hidden}
.mbox.v-top{justify-content:flex-start}
.mbox.v-bottom{justify-content:flex-end}
.mbox > span{display:block;max-width:100%;white-space:pre-line;overflow-wrap:break-word}
.mbox.impact{font-family:var(--meme);color:var(--meme-paper);text-shadow:.06em .06em 0 var(--meme-edge),-.06em .06em 0 var(--meme-edge),.06em -.06em 0 var(--meme-edge),-.06em -.06em 0 var(--meme-edge),0 .07em 0 var(--meme-edge),.07em 0 0 var(--meme-edge),0 -.07em 0 var(--meme-edge),-.07em 0 0 var(--meme-edge)}
.mbox.ink{font-family:var(--meme-ink);font-weight:700;color:var(--meme-text)}
.mbox.sub{font-family:var(--meme-ink);font-weight:700;color:var(--meme-paper);text-shadow:0 .05em .2em var(--meme-edge),0 0 .12em var(--meme-edge)}

/* το κουτί */
.box-ov{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:var(--scrim);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ov-stage{position:relative;width:min(100%,460px);display:grid;justify-items:center}
.pbox{width:min(70vw,260px);height:auto;overflow:visible;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6));transform-origin:50% 90%;transition:opacity .4s .35s}
.pbox .b-fill{fill:var(--panel-2);stroke:var(--gold);stroke-width:3}
.pbox .b-trim{fill:var(--gold)}
.pbox .b-lock{fill:var(--gold-deep);stroke:var(--gold);stroke-width:2}
.pbox .b-key{fill:var(--ink)}
.pbox-lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
.ov-burst{position:absolute;left:50%;top:45%;width:min(140vw,640px);aspect-ratio:1/1;transform:translate(-50%,-50%) scale(.2);opacity:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,204,51,.32) 0deg 10deg,transparent 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 68%);mask:radial-gradient(circle,#000 18%,transparent 68%);transition:opacity .4s,transform .6s;pointer-events:none}
.ov-card{position:absolute;left:50%;top:50%;width:min(92vw,440px);max-height:88vh;overflow:auto;display:grid;gap:14px;justify-items:center;text-align:center;padding:20px 18px 16px;border-radius:22px;background:var(--panel);border:3px solid var(--gold);box-shadow:0 0 50px -6px var(--gold),0 8px 0 rgba(0,0,0,.4);opacity:0;pointer-events:none;transform:translate(-50%,-25%) scale(.2);transition:transform .45s cubic-bezier(.2,1.3,.4,1) .15s,opacity .3s .15s}
.ov-card .ex-name{color:var(--gold)}
.ov-card .link{justify-self:center}
.ov-stage.shake .pbox{animation:boxshake .9s ease-in-out}
.ov-stage.open .pbox{opacity:.3}
.ov-stage.open .pbox-lid{transform:translate(-14px,-80px) rotate(-30deg)}
.ov-stage.open .ov-burst{opacity:1;transform:translate(-50%,-50%) scale(1);animation:burst 12s linear infinite}
.ov-stage.open .ov-card{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}

/* drop table */
.drop-wrap{overflow-x:auto;border-radius:16px;border:2px solid var(--line);background:var(--panel)}
.drops{border-collapse:collapse;width:100%;min-width:980px;font-size:.85rem;font-variant-numeric:tabular-nums}
.drops th,.drops td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.drops thead th{background:var(--panel-2)}
.drops td small,.drops th small{display:block;color:var(--muted);font-size:.74rem;font-weight:400}
.drops tbody th{font-weight:700}
.drops tr.grp th{font-family:var(--display);font-weight:400;font-size:1.15rem;letter-spacing:.08em;color:var(--gold);background:var(--bg-2)}

/* log + settings */
.foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:28px 36px;align-items:start}
.foot > *{min-width:0}
.log-block{display:grid;gap:4px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:2px solid var(--line)}
.block-head h3{font-family:var(--display);font-weight:400;font-size:1.7rem;letter-spacing:.05em;line-height:1}
.block-head span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;grid-template-areas:"time ex out" "time meta out";column-gap:12px;row-gap:4px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.log li.empty{display:block;color:var(--muted);font-size:.9rem;padding:14px 0;border:0}
.l-time{grid-area:time;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.l-ex{grid-area:ex;min-width:0;font-weight:800}
.l-ex i{font-style:normal;font-size:.72rem;font-weight:700;color:var(--gold);margin-left:6px}
.l-meta{grid-area:meta;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.l-meta .tb{font-size:.8rem}
.l-out{grid-area:out;font-family:var(--display);font-size:1.1rem;letter-spacing:.06em;line-height:1;padding:5px 9px 3px;border-radius:8px;border:2px solid transparent}
.l-out.ok{color:var(--ink);background:var(--gold)}
.l-out.no{color:var(--muted);border-color:var(--line)}
.settings summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:2px solid var(--line)}
.settings summary::-webkit-details-marker{display:none}
.settings summary::after{content:"+";font-family:var(--display);font-size:1.6rem;line-height:1;color:var(--gold)}
.settings[open] summary::after{content:"\2212"}
.sum-title{font-family:var(--display);font-weight:400;font-size:1.7rem;letter-spacing:.05em;line-height:1}
.set-body{display:grid;gap:24px;padding-top:16px}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled{opacity:.55}
legend{padding:0;margin-bottom:10px;font-size:.76rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.odds{display:grid;gap:6px}
.odd{display:grid;grid-template-columns:9em minmax(0,1fr) 5em 1em;align-items:center;gap:10px}
.odd .tb{text-align:center}

const C = {};

const RAINBOW = ['r5', 'gold', 'r1', 'r2', 'r3'];

class Wheel {
  constructor(canvas, button){
    this.c = canvas; this.ctx = canvas.getContext('2d');
    this.rot = 0; this.segs = []; this.winner = null; this.spinning = false; this.dim = false;
    canvas.addEventListener('click', () => { if (!button.disabled) button.click(); });
  }
  setSegments(list){
    const total = list.reduce((a, s) => a + s.w, 0) || 1;
    let a = 0;
    this.segs = list.map(s => { const span = s.w / total * TAU; const seg = Object.assign({}, s, { start: a, end: a + span }); a += span; return seg; });
  }
  // γωνία δεξιόστροφα από την κορυφή, εκεί που είναι ο δείκτης
  indexAt(rot){
    const a = mod(-rot, TAU);
    for (let i = 0; i < this.segs.length; i++) if (a >= this.segs[i].start && a < this.segs[i].end) return i;
    return this.segs.length - 1;
  }
  draw(){
    const c = this.c, ctx = this.ctx, size = c.clientWidth;
    if (!size) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3), px = Math.round(size * dpr);
    if (c.width !== px || c.height !== px){ c.width = px; c.height = px; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    const R = size / 2 - 8, hubR = R * 0.2, avail = R - 16 - hubR - 6;

    ctx.save();
    ctx.translate(size / 2, size / 2);
    ctx.rotate(this.rot);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (const s of this.segs){
      const span = s.end - s.start;
      if (span < 1e-4) continue;
      const win = this.winner === s.key;
      ctx.globalAlpha = this.winner != null && !win ? 0.28 : 1;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, s.start - Math.PI / 2, s.end - Math.PI / 2);
      ctx.closePath();
      if (win && s.winFill) ctx.fillStyle = s.winFill;
      else if (s.rainbow){
        const g = ctx.createLinearGradient(-R, -R, R, R);
        RAINBOW.forEach((k, i) => g.addColorStop(i / (RAINBOW.length - 1), C[k]));
        ctx.fillStyle = g;
      } else ctx.fillStyle = s.fill;
      ctx.fill();
      if (s.overlay && !win){ ctx.fillStyle = s.overlay; ctx.fill(); }
      ctx.lineWidth = 2;
      ctx.strokeStyle = C.bg;
      ctx.stroke();

      const label = win && s.winLabel ? s.winLabel : s.label;
      let fs = Math.min(s.big && !win ? R * 0.2 : R * 0.1, span * R * 0.42);
      ctx.font = fs + 'px ' + WHEEL_FONT;
      const w = ctx.measureText(label).width;
      if (w > avail){ fs *= avail / w; ctx.font = fs + 'px ' + WHEEL_FONT; }
      if (fs >= 7 && s.upright && !win){
        // τα «?» μένουν όρθια όπως κι αν γυρίσει ο τροχός
        const a = (s.start + s.end) / 2, rr = (R + hubR) / 2 + 8;
        ctx.save();
        ctx.translate(Math.sin(a) * rr, -Math.cos(a) * rr);
        ctx.rotate(-this.rot);
        ctx.textAlign = 'center';
        ctx.fillStyle = s.text;
        ctx.fillText(label, 0, 1);
        ctx.restore();
      } else if (fs >= 7){
        ctx.save();
        ctx.rotate((s.start + s.end) / 2 - Math.PI / 2);
        ctx.fillStyle = win && s.winText ? s.winText : s.text;
        ctx.fillText(label, R - 16, 1);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.lineWidth = 8; ctx.strokeStyle = C['gold-deep']; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.lineWidth = 3; ctx.strokeStyle = C.gold; ctx.stroke();
    for (let i = 0; i < 24; i++){
      const a = i / 24 * TAU;
      ctx.beginPath(); ctx.arc(Math.sin(a) * R, -Math.cos(a) * R, 3, 0, TAU);
      ctx.fillStyle = i % 2 ? C.gold : C.fg; ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(size / 2, size / 2);
    ctx.beginPath(); ctx.arc(0, 0, hubR, 0, TAU);
    ctx.fillStyle = C.bg; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = C.gold; ctx.stroke();
    ctx.fillStyle = C.gold;
    ctx.font = (hubR * 0.62) + 'px ' + WHEEL_FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('SPIN', 0, hubR * 0.06);
    ctx.restore();
  }
  spinTo(idx, opts, done){
    const s = this.segs[idx], span = s.end - s.start;
    const theta = s.start + span * (0.2 + 0.6 * rand());
    const from = this.rot;
    const turns = reducedMotion ? 0 : (opts.turns != null ? opts.turns : 5 + Math.floor(rand() * 3));
    const to = from + mod(-theta - from, TAU) + TAU * turns;
    const dur = reducedMotion ? 600 : (opts.dur || 5200);
    this.winner = null;
    this.spinning = true;
    let last = this.indexAt(from);
    const t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4);
      this.rot = from + (to - from) * e;
      const i = this.indexAt(this.rot);
      if (i !== last){ last = i; tick(); }
      this.draw();
      if (k < 1){ requestAnimationFrame(step); return; }
      this.rot = mod(this.rot, TAU);
      this.spinning = false;
      this.winner = s.key;
      this.draw();
      if (done) done(s);
    };
    requestAnimationFrame(step);
  }
}

// Κάθε βήμα: work (με χρόνο ή επαναλήψεις), switch (αλλαγή πλευράς) ή rest (ανάσα ανάμεσα στα σετ)
const W = { ex: null, combo: null, rest: 0, steps: [], i: 0, left: 0, prep: 0, iv: 0, last: 0, running: false, started: false, done: false };
let wake = null;
function requestWake(){ try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {}); } catch (e) {} }

function wkMount(ex, combo, rest){
  wkPause();

  for (let s = 1; s <= combo.sets; s++){
    for (let side = 1; side <= sides; side++){
      steps.push({ kind: 'work', set: s, side, dur: timed ? per : 0 });
      if (side < sides) steps.push({ kind: 'switch', set: s, dur: 5 });
    }
    if (s < combo.sets) steps.push({ kind: 'rest', set: s, dur: rest });
  }
  Object.assign(W, { ex, combo, rest, steps, i: 0, left: steps[0].dur, prep: 0, started: !timed, done: false });
  wkPaint();
}
function wkMain(){
  initAudio();

  const st = W.steps[W.i];
  if (!W.started){ W.started = true; W.prep = 3; beep(660, 0.1); wkRun(); wkPaint(); return; }
  if (st.kind !== 'work' || !st.dur){ wkNext(); return; }   // σετ επαναλήψεων έγινε, ή skip της ανάσας
  if (W.running) wkPause(); else wkRun();

}
function wkNext(){
  W.i++;
  if (W.i >= W.steps.length){ W.done = true; W.left = 0; wkPause(); fanfare(2); wkPaint(); return; }
  const st = W.steps[W.i];
  W.left = st.dur; W.prep = 0;
  if (st.kind === 'work'){ beep(990, 0.25); if (st.dur) wkRun(); else wkPause(); }
  else { beep(440, 0.2); wkRun(); }

}

  const now = performance.now(), dt = (now - W.last) / 1000;

    const b = Math.ceil(W.prep);

    const a = Math.ceil(W.prep);
    if (a < b) beep(a > 0 ? 660 : 990, a > 0 ? 0.1 : 0.25);
    wkPaint();
    return;
  }
  const st = W.steps[W.i];
  if (!st || !st.dur) return;
  const b = Math.ceil(W.left);
  W.left -= dt;
  const a = Math.max(0, Math.ceil(W.left));

}

  const face = $('wk-face');

  const sets = W.combo.sets, st = W.steps[Math.min(W.i, W.steps.length - 1)];
  const doneSets = W.done ? sets : st.kind === 'rest' ? st.set : st.set - 1;
  let label, txt, bar;
  if (W.done){ label = 'ΤΕΛΟΣ'; txt = 'DONE'; bar = 1; }
  else if (W.prep > 0){ label = 'ΕΤΟΙΜΟΣ;'; txt = String(Math.ceil(W.prep)); bar = 0; }
  else if (st.kind === 'rest'){ label = 'ΑΝΑΣΑ'; txt = clock(Math.ceil(W.left)); bar = 1 - W.left / st.dur; }
  else if (st.kind === 'switch'){ label = 'ΑΛΛΑΞΕ ΠΛΕΥΡΑ'; txt = clock(Math.ceil(W.left)); bar = 1 - W.left / st.dur; }
  else {
    label = (sets > 1 ? `ΣΕΤ ${st.set}/${sets}` : 'GO') + (W.ex.perSide ? ` · ΠΛΕΥΡΑ ${st.side}` : '');

}

  const boxes = (m.boxes || []).map(b => {
    const s = b.s || 'impact', v = b.v || (s !== 'impact' ? 'mid' : b.y < 50 ? 'top' : 'bottom');
    return `<span class="mbox ${s} v-${v}" style="left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%"><span>${esc(b.t)}</span></span>`;
  }).join('');
  return `<figure class="meme${tall ? ' tall' : ''}${small ? ' small' : ''}">
    ${m.cap ? `<figcaption class="meme-cap">${esc(m.cap)}</figcaption>` : ''}
    <div class="meme-frame" style="aspect-ratio:${m.w}/${m.h}">
      <img src="memes/${id}.jpg" alt="Meme για ${esc(ex.name)}" width="${m.w}" height="${m.h}">${boxes}
    </div>
  </figure>`;
}
function fitBox(box){
  const inner = box.firstElementChild, H = box.clientHeight, Wd = box.clientWidth;
  if (!inner || !H || !Wd) return;
  let fs = Math.min(H * 0.9, Wd * 0.16, 60);
  box.style.fontSize = fs + 'px';
  for (let i = 0; i < 40 && fs > 6 && (inner.offsetHeight > H || inner.scrollWidth > Wd); i++){ fs *= 0.92; box.style.fontSize = fs + 'px'; }
}
const memeRO = 'ResizeObserver' in window ? new ResizeObserver(list => list.forEach(en => en.target.querySelectorAll('.mbox').forEach(fitBox))) : null;
function fitMemes(root){
  root.querySelectorAll('.meme-frame').forEach(fr => { fr.querySelectorAll('.mbox').forEach(fitBox); if (memeRO) memeRO.observe(fr); });
}
function videoHTML(ex){
  const v = VIDEOS[ex.id];
  if (!v) return '';
  const url = (v.short ? 'https://www.youtube.com/shorts/' : 'https://www.youtube.com/watch?v=') + v.id;
  if (CAN_EMBED){
    const src = `https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&mute=1&loop=1&playlist=${v.id}&playsinline=1&rel=0&modestbranding=1`;
    return `<div class="video${v.short ? ' short' : ''}">
      <div class="video-frame"><iframe src="${src}" title="${esc(ex.name)}: πώς γίνεται" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
      <a class="video-link" href="${url}" target="_blank" rel="noopener">YouTube · ${esc(v.channel || '')}</a>
    </div>`;
  }
  return `<a class="video-cta" href="${url}" target="_blank" rel="noopener"><span class="play" aria-hidden="true"></span>Δες πώς γίνεται</a>`;
}

// ---------- κατάσταση & οθόνες ----------
// phase: idle → spinEx → needTier → spinTier → needSets → spinSets → result (ο διάδρομος πάει κατευθείαν στο result)
//        forced = η rarity είναι ήδη γνωστή (το κουτί ξανανοίγει ή αλλαγή άσκησης)
const state = { phase: 'idle', ex: null, tier: null, combo: null, isBonus: false, forced: null, forcedWhy: null };

const spin1 = $('spin1'), spin2 = $('spin2'), spin3 = $('spin3'), verdict = $('verdict');
const w1Card = $('w1'), w2Card = $('w2'), w3Card = $('w3');
const wheel1 = new Wheel($('c1'), spin1), wheel2 = new Wheel($('c2'), spin2), wheel3 = new Wheel($('c3'), spin3);
wheel1.rot = rand() * TAU;
wheel3.rot = rand() * TAU;

function resetWheel3(){
  wheel3.setSegments(mysterySegments(C.muted));
  wheel3.winner = null;
  wheel3.draw();
}

const VIEW = {
  result(){
    const ex = state.ex, t = state.tier, tier = TIERS[t], c = state.combo, kg = kgTxt(ex, t);
    return `<article class="loot" data-t="${t}">
      <div class="loot-banner">${tier.name} · ${state.isBonus ? 'BONUS' : tier.taunt}</div>
      <div class="loot-inner">
        <div class="loot-main">
          <div class="name-row"><h2 class="ex-name">${esc(ex.name)}</h2>${pipsHTML(ex)}</div>
          <div class="stat-num">${comboTxt(ex, c)}</div>
          <div class="pills">${kg ? `<span class="kg">${esc(kg)}</span>` : ''}${ex.perSide ? '<span class="pill">ανά πλευρά</span>' : ''}${c.sets > 1 ? `<span class="pill">ανάσα ${tier.rest}″</span>` : ''}${c.sets === 1 && ex.unit !== 'min' ? '<span class="pill hot">ALL IN</span>' : ''}</div>
          ${wkHTML()}
          <div class="actions">
            <button class="btn" type="button" data-act="done">ΤΟ ΕΚΑΝΑ +${xpFor(ex, t)} XP</button>
            <button class="btn btn-ghost" type="button" data-act="fail">ΛΥΓΙΣΑ</button>
          </div>
          <button class="link" type="button" data-act="skip">Δεν έχω εξοπλισμό</button>
        </div>
        <aside class="loot-side">${videoHTML(ex)}${memeHTML(ex.id, true)}</aside>
      </div>
    </article>`;
  },
  forced(){
    const t = state.forced;
    return `<div class="card panel" data-t="${t}">
      <h2 class="title">${state.forcedWhy === 'bonus' ? 'ΝΟΜΙΖΕΣ ΟΤΙ ΤΕΛΕΙΩΣΕΣ;' : 'ΣΙΓΑ ΜΗ ΣΕ ΠΙΣΤΕΨΑΜΕ'}</h2>
      <span class="tb" data-t="${t}">${TIERS[t].name}</span>
    </div>`;
  }
};

function setBusy(b){ $('fs-odds').disabled = b; $('fs-ex').disabled = b; $('reset').disabled = b; }

function render(){
  const p = state.phase;
  spin1.disabled = !(p === 'idle' || p === 'forced');
  spin2.disabled = p !== 'needTier';
  spin3.disabled = p !== 'needSets';
  spin1.textContent = p === 'forced' ? (state.forcedWhy === 'bonus' ? 'OPEN' : 'REROLL') : 'SPIN';
  w1Card.classList.toggle('live', p === 'idle' || p === 'forced');
  w2Card.classList.toggle('live', p === 'needTier');
  w3Card.classList.toggle('live', p === 'needSets');
  setBusy(p === 'spinEx' || p === 'spinTier' || p === 'spinSets');
  if (p !== 'result') wkPause();
  const html = VIEW[p] ? VIEW[p]() : '';
  verdict.innerHTML = html;
  verdict.hidden = !html;
  if (p === 'result') wkMount(state.ex, state.combo, TIERS[state.tier].rest);
  fitMemes(verdict);
}

// μετά τη rarity: τροχός σετ, εκτός από τον διάδρομο που παίρνει κατευθείαν τυχαία λεπτά
function afterTier(tier, isBonus){
  state.tier = tier; state.isBonus = isBonus;
  state.forced = null; state.forcedWhy = null;
  fanfare(tier);
  if (tier === 2) confetti([C.r2, C.fg], 40);
  if (tier === 3) confetti([C.r3, C.gold, C.fg], 90);
  if (tier >= 4){ confetti(tier === 6 ? RAINBOW.map(k => C[k]) : [C['r' + tier], C.gold, C.fg], 120 + tier * 20); shake(); }
  if (state.ex.unit === 'min'){
    state.combo = { sets: 1, per: rollMinutes(state.ex, tier) };
    state.phase = 'result';
    render();
    scrollToEl(verdict);
  } else {
    state.combo = null;
    state.phase = 'needSets';
    wheel3.setSegments(comboSegments(state.ex, tier));
    wheel3.winner = null;
    wheel3.draw();
    render();
    scrollToEl(w3Card);
  }
}

// ---------- το κουτί που ανοίγει ----------
let boxDone = null, boxTimer = 0;
function openBox(ex, done){
  const ov = $('box-ov'), stage = $('ov-stage');
  $('ov-name').textContent = ex.name;
  $('ov-pips').innerHTML = pipsHTML(ex);
  $('ov-meme').innerHTML = memeHTML(ex.id, true);
  boxDone = done;
  stage.classList.remove('shake', 'open');
  ov.hidden = false;
  const reveal = () => {
    stage.classList.add('open');
    fitMemes($('ov-meme'));
    $('ov-go').focus({ preventScroll: true });
  };
  if (reducedMotion){ reveal(); return; }
  void stage.offsetWidth;
  stage.classList.add('shake');
  tone(70, 0.9, 'sawtooth', 0.06);
  clearTimeout(boxTimer);
  boxTimer = setTimeout(() => {
    reveal();
    tone(392, 0.15, 'square', 0.07); tone(523, 0.15, 'square', 0.07, 0.08); tone(784, 0.4, 'square', 0.07, 0.16);
    confetti([C.gold, C.r3, C.fg], 70);
  }, 900);
}
function closeBox(choice){
  const ov = $('box-ov');
  if (ov.hidden) return;
  clearTimeout(boxTimer);
  ov.hidden = true;
  const f = boxDone; boxDone = null;
  if (f) f(choice);
}
$('ov-go').addEventListener('click', () => closeBox('go'));
$('ov-skip').addEventListener('click', () => closeBox('skip'));
$('box-ov').addEventListener('click', e => { if (e.target === e.currentTarget && $('ov-stage').classList.contains('open')) closeBox('go'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBox('go'); });

spin1.addEventListener('click', () => {
  if (wheel1.spinning || wheel2.spinning || wheel3.spinning || !(state.phase === 'idle' || state.phase === 'forced')) return;
  initAudio();
  const forced = state.phase === 'forced' ? state.forced : null, why = state.forcedWhy;
  state.ex = null; state.tier = null; state.combo = null;
  wheel2.winner = null; wheel2.draw();
  resetWheel3();
  state.phase = 'spinEx';
  render();
  const ex = pickExercise(), idx = Math.floor(rand() * wheel1.segs.length);
  wheel1.segs.forEach(s => { s.winLabel = null; });
  wheel1.segs[idx].winLabel = ex.short;
  wheel1.spinTo(idx, {}, () => {
    state.ex = ex;
    state.phase = forced != null ? 'spinTier' : 'needTier';
    render();
    pop();
    openBox(ex, choice => {
      if (choice === 'skip'){
        // ίδια rarity αν ήταν ήδη κλειδωμένη, αλλιώς ξανά από τον πρώτο τροχό
        state.ex = null; wheel1.winner = null; wheel1.draw();
        state.phase = forced != null ? 'forced' : 'idle';
        render();
        scrollToEl(w1Card);
        return;
      }
      if (forced != null) wheel2.spinTo(forced, { dur: 1800, turns: 1 }, () => afterTier(forced, why === 'bonus'));
      else scrollToEl(w2Card);
    });
  });
});

spin2.addEventListener('click', () => {
  if (wheel2.spinning || state.phase !== 'needTier') return;
  initAudio();
  state.phase = 'spinTier';
  render();
  const idx = pickWeighted(wheel2.segs.map(s => s.w));
  wheel2.spinTo(idx, {}, () => afterTier(idx, false));
});

spin3.addEventListener('click', () => {
  if (wheel3.spinning || state.phase !== 'needSets') return;
  initAudio();
  state.phase = 'spinSets';
  render();
  wheel3.spinTo(Math.floor(rand() * wheel3.segs.length), { dur: 3800 }, seg => {
    state.combo = seg.combo;
    state.phase = 'result';
    pop();
    render();
    if (seg.combo.sets === 1) shake();
    scrollToEl(verdict);
  });
});

function outcome(ok){
  const ex = state.ex, t = state.tier, c = state.combo, gained = ok ? xpFor(ex, t) : 0;
  const e = { at: Date.now(), ex: ex.id, t, s: c.sets, v: c.per, ok, xp: gained, bonus: state.isBonus };
  log.push(e); store.set(LOG_KEY, log);
  const before = levelOf(xp);
  xp += gained; store.set('pbox2-xp', xp);
  const after = levelOf(xp);
  renderLog();
  if (gained){ coin(); toast('+' + gained + ' XP · ' + pickOne(HYPE)); } else { sadTrombone(); toast(pickOne(ROAST)); }
  if (after > before) setTimeout(() => { levelUpSound(); toast('LEVEL UP! LVL ' + after); confetti([C.gold, C.r4, C.fg], 90); }, 1400);
  const bonusTier = state.isBonus ? undefined : BONUS_OF[t];
  state.ex = null; state.tier = null; state.combo = null; state.isBonus = false;
  wheel1.winner = null; wheel2.winner = null; wheel1.draw(); wheel2.draw();
  resetWheel3();
  if (bonusTier != null){ state.phase = 'forced'; state.forced = bonusTier; state.forcedWhy = 'bonus'; }
  else state.phase = 'idle';
  render();
  scrollToEl(state.phase === 'forced' ? verdict : w1Card);
}

function skip(){
  if (state.phase !== 'result') return;
  // η rarity δεν ξαναπαίζεται: αλλάζει μόνο η άσκηση
  state.forced = state.tier; state.forcedWhy = state.isBonus ? 'bonus' : 'swap';
  state.ex = null; state.tier = null; state.combo = null; state.isBonus = false;
  state.phase = 'forced';
  wheel1.winner = null; wheel1.draw();
  resetWheel3();
  render();
  scrollToEl(w1Card);
}

verdict.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'done') outcome(true);
  else if (a === 'fail') outcome(false);
  else if (a === 'skip') skip();
  else if (a === 'wk-main') wkMain();
  else if (a === 'wk-reset') wkMount(W.ex, W.combo, W.rest);
});

// ---------- player bar ----------
function paintPlayer(){
  const lv = levelOf(xp), a = levelStart(lv), b = levelStart(lv + 1);
  $('lvl').textContent = lv;
  $('xp-fill').style.width = ((xp - a) / (b - a) * 100) + '%';
  $('xp-text').textContent = (xp - a) + ' / ' + (b - a) + ' XP';
}

// ---------- λίστα ημέρας ----------
const logEl = $('log'), clearBtn = $('log-clear');
function renderLog(){
  logEl.innerHTML = log.length ? log.slice().reverse().map(e => {
    const ex = exById(e.ex);
    const time = new Date(e.at).toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' });
    return `<li>
      <span class="l-time">${time}</span>
      <span class="l-ex">${esc(ex.name)}${e.bonus ? '<i>BONUS</i>' : ''}</span>
      <span class="l-meta"><span class="tb" data-t="${e.t}">${TIERS[e.t].name}</span>${comboTxt(ex, { sets: e.s || 1, per: e.v })}${ex.kg ? ' · ' + kgShort(ex, e.t) : ''}</span>
      <span class="l-out ${e.ok ? 'ok' : 'no'}">${e.ok ? '+' + e.xp + ' XP' : 'FAIL'}</span>
    </li>`;
  }).join('') : '<li class="empty">Άδειο. Όπως και η αντοχή σου.</li>';
  $('log-sum').textContent = log.length ? `${log.filter(e => e.ok).length}/${log.length}` : '';
  clearBtn.hidden = !log.length;
  paintPlayer();
}
function twoStep(btn, label, armedLabel, action){
  let armed = 0;
  btn.addEventListener('click', () => {
    if (!armed){
      btn.textContent = armedLabel;
      armed = setTimeout(() => { armed = 0; btn.textContent = label; }, 3000);
      return;
    }
    clearTimeout(armed); armed = 0; btn.textContent = label;
    action();
  });
}
twoStep(clearBtn, 'Καθάρισε τη λίστα', 'Σίγουρα; Πάτα ξανά', () => { log = []; store.set(LOG_KEY, log); renderLog(); });
twoStep($('xp-reset'), 'Μηδένισε XP και level', 'Σίγουρα; Πάτα ξανά', () => { xp = 0; store.set('pbox2-xp', xp); paintPlayer(); });

// ---------- drop table ----------
function renderDrops(){
  const head = `<tr><th scope="col">Άσκηση</th>${TIERS.map((t, i) => `<th scope="col" data-t="${i}"><span class="tb">${t.name}</span></th>`).join('')}</tr>`;
  const body = Object.keys(GROUPS).map(g => `<tr class="grp"><th colspan="${TIERS.length + 1}" scope="rowgroup">${GROUPS[g].name}</th></tr>` +
    EX.filter(e => e.group === g).map(e => `<tr>
      <th scope="row">${esc(e.name)}${e.perSide ? '<small>ανά πλευρά</small>' : ''}${e.kgNote && e.kg ? `<small>βάρος ${esc(e.kgNote)}</small>` : ''}</th>
      ${TIERS.map((t, i) => `<td>${rangeTxt(e, i)}${e.kg ? `<small>${kgShort(e, i)}</small>` : ''}</td>`).join('')}
    </tr>`).join('')).join('');
  $('drop-wrap').innerHTML = `<table class="drops"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

// ---------- ρυθμίσεις ----------
const oddsEl = $('odds'), exListEl = $('exlist');
function renderSettings(){
  oddsEl.innerHTML = TIERS.map((t, i) => `
    <label class="odd" for="odd-${i}" data-t="${i}">
      <span class="tb">${t.name}</span><span></span>
      <input type="number" id="odd-${i}" min="0" max="100" step="1" inputmode="numeric" value="${odds[i]}">
      <span>%</span>
    </label>`).join('');
  exListEl.innerHTML = Object.keys(GROUPS).map(g => `
    <div class="ex-group">
      <p class="ex-gname" style="--c:var(${GROUPS[g].color})"><i></i>${GROUPS[g].name}</p>
      ${EX.filter(e => e.group === g).map(e => `<label class="exo" for="ex-${e.id}"><input type="checkbox" id="ex-${e.id}"${enabled.includes(e.id) ? ' checked' : ''}><span>${esc(e.name)}</span></label>`).join('')}
    </div>`).join('');
}
function refreshTier(){
  wheel2.setSegments(tierSegments());
  wheel2.draw();
  const sum = oddsSum();
  $('odds-note').textContent = sum === 100 ? 'Σύνολο 100%.' : `Σύνολο ${sum}%. Ο τροχός τα μοιράζει αναλογικά (π.χ. Common ${pctText(odds[0] / sum)}).`;
}
oddsEl.addEventListener('input', e => {
  const inp = e.target, i = +inp.id.slice(4);
  if (inp.value === '') return;
  const v = Math.max(0, Math.min(100, Math.round(Number(inp.value))));
  if (!Number.isFinite(v)) return;
  const next = odds.slice(); next[i] = v;
  if (!next.some(n => n > 0)){ $('odds-note').textContent = 'Τουλάχιστον μία rarity χρειάζεται πιθανότητα πάνω από 0.'; return; }
  odds = next; saveSettings(); refreshTier();
});
oddsEl.addEventListener('change', e => { const i = +e.target.id.slice(4); e.target.value = odds[i]; });
exListEl.addEventListener('change', e => {
  const inp = e.target, id = inp.id.slice(3);
  const next = inp.checked ? EX.map(x => x.id).filter(x => x === id || enabled.includes(x)) : enabled.filter(x => x !== id);
  if (next.length < 2){ inp.checked = true; $('ex-note').textContent = 'Χρειάζονται τουλάχιστον 2 ασκήσεις στον τροχό.'; return; }
  $('ex-note').textContent = 'Βγάλε ό,τι δεν έχει το γυμναστήριό σου.';
  enabled = next; saveSettings();
});
$('reset').addEventListener('click', () => {
  odds = DEFAULT_ODDS.slice(); enabled = EX.map(e => e.id);
  saveSettings(); renderSettings(); refreshTier();
  $('ex-note').textContent = 'Βγάλε ό,τι δεν έχει το γυμναστήριό σου.';
});

// ---------- ήχος on/off ----------
const soundBtn = $('sound');
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function paintSound(){ soundBtn.innerHTML = soundOn ? ICON_ON : ICON_OFF; soundBtn.setAttribute('aria-pressed', String(soundOn)); soundBtn.setAttribute('aria-label', soundOn ? 'Ήχος ανοιχτός' : 'Ήχος κλειστός'); }
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; store.set('pbox2-sound', soundOn);
  if (soundOn){ initAudio(); coin(); }
  paintSound();
});

// ---------- εκκίνηση ----------
wheel1.setSegments(mysterySegments());
resetWheel3();
renderSettings();
refreshTier();
renderDrops();
renderLog();
paintSound();

// #demo δείχνει κατευθείαν μια κάρτα drop, #demo-box το κουτί ανοιχτό (για έλεγχο της εμφάνισης)
if (location.hash === '#demo'){
  state.ex = exById('farmer'); state.tier = 5; state.combo = setCombos(state.ex, 5)[3]; state.phase = 'result';
  wheel1.segs[0].winLabel = state.ex.short; wheel1.winner = 'm0'; wheel2.winner = 't5';
  wheel3.setSegments(comboSegments(state.ex, 5)); wheel3.winner = 'c3';
}
render();
if (location.hash === '#demo-box') openBox(exById('abwheel'), null);

const drawAll = () => { wheel1.draw(); wheel2.draw(); wheel3.draw(); };
if ('ResizeObserver' in window){ const ro = new ResizeObserver(drawAll); [$('c1'), $('c2'), $('c3')].forEach(c => ro.observe(c)); }
else window.addEventListener('resize', drawAll);
if (document.fonts && document.fonts.load){
  Promise.all([
    document.fonts.load('20px Bangers', 'SPIN COMMON PANDORA Plank 3x20 ?'),
    document.fonts.load('20px Anton', 'MY GRIP'),
    document.fonts.ready
  ]).then(() => { drawAll(); fitMemes(document.body); }, drawAll);
}
})();
</script>
